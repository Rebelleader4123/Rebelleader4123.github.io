<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Audio Ripper</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f8;
      }
      .card {
        width: min(560px, 92vw);
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: grid;
        gap: 12px;
      }
      input,
      button {
        font-size: 16px;
        padding: 10px 12px;
      }
      button {
        cursor: pointer;
      }
      .error {
        color: #b00020;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>YouTube Audio Downloader</h1>
      <p>Paste a YouTube link, then download the audio file.</p>

      <form id="download-form">
        <label for="url">YouTube URL</label>
        <input
          id="url"
          name="url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          required
        />
        <button type="submit">Get Audio Download Link</button>
      </form>

      <p id="error" class="error hidden"></p>
      <p id="status" class="hidden">Preparing download...</p>
    </main>

    <script>
      const form = document.getElementById('download-form');
      const urlInput = document.getElementById('url');
      const errorNode = document.getElementById('error');
      const statusNode = document.getElementById('status');

      function isYoutubeUrl(url) {
        const lowered = url.toLowerCase();
        return lowered.includes('youtube.com/watch') || lowered.includes('youtu.be/');
      }

      function showError(message) {
        errorNode.textContent = message;
        errorNode.classList.remove('hidden');
      }

      function clearMessages() {
        errorNode.textContent = '';
        errorNode.classList.add('hidden');
        statusNode.classList.add('hidden');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearMessages();

        const videoUrl = urlInput.value.trim();
        if (!isYoutubeUrl(videoUrl)) {
          showError('Please enter a valid YouTube URL.');
          return;
        }

        statusNode.classList.remove('hidden');

        try {
          const response = await fetch('https://api.cobalt.tools/api/json', {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              url: videoUrl,
              isAudioOnly: true,
              filenameStyle: 'basic'
            })
          });

          const data = await response.json();
          if (!response.ok || !data.url) {
            showError('Could not prepare audio download for this link. Try another URL.');
            return;
          }

          window.location.href = data.url;
        } catch (_error) {
          showError('Download service is currently unavailable. Please try again later.');
        } finally {
          statusNode.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>
